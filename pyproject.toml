[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "document-chunker-sdk"
version = "1.7.0"
description = "Local document chunking SDK with Angular UI; no AI or vector database dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pydantic>=2.6,<3", "pypdf>=4.2,<6", "openpyxl>=3.1,<4", "python-docx>=1.1,<2"]
[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "python-multipart>=0.0.9"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include = ["chunker_sdk*", "app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
